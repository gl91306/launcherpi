<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Launcher Pi</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval';" />
  <link rel="stylesheet" href="css/index.css">
</head>

<body style="background: rgb(68, 65, 65);" class="bg-launcher">
  <div class="main-content">
    <h1 class="mc-font text-center" style="font-size: 3em; color: white;">Launcherpi</h1>
    <div class="AccountDiv text-center" style="max-width: 600px;">
      <div id="versionbar">
        <p style="font-size: 1.3em; margin-top: 10px; margin-bottom: 10px; text-shadow: 1px 1px green;">Select version
        </p>
        <select name="subject" id="subject">
          <option value="" selected="selected">Installed: </option>
        </select>
      </div>
      <button id="launchbutton" class="btn launch">Launch</button>
      <div class="download-area">
        <p id="islog">Checking login status...</p>
        <div class="progress">
          <div class="progress-bar" id="progressBar" style="display: none;"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/launch.js"></script>
</body>

</html>
